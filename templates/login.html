<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stafflytics AI</title>
    <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1e1b4b;
            --accent: #d97706;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .login-card {
            background: var(--surface);
            padding: 3rem;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logo i {
            color: var(--accent);
        }

        h2 {
            margin-bottom: 2rem;
            font-weight: 400;
            color: #94a3b8;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-login {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            background: #b45309;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #475569;
        }

        @media (max-width: 480px) {
            body {
                height: 100vh;
                height: 100dvh;
                padding: 1rem;
                align-items: flex-start;
                padding-top: 8vh;
                overflow: auto;
            }
            .login-card {
                padding: 2rem 1.5rem;
                border-radius: 24px;
                max-width: 100%;
            }
            .logo { font-size: 1.9rem; }
            h2 { font-size: 1.05rem; margin-bottom: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo" style="margin-bottom: 1.5rem; flex-direction: column; gap: 8px;">
            <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Stafflytics Logo" style="width: 72px; height: 72px; filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));">
            <div style="font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Stafflytics AI</div>
        </div>
        <h2>Enterprise Intelligence Login</h2>
        
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="owner_admin" autocomplete="off">
        </div>
        <div class="form-group">
            <label>Master Security Password</label>
            <div style="position: relative; display: flex; align-items: center;">
                <input type="password" id="password" placeholder="••••••••" autocomplete="off" style="padding-right: 45px;">
                <i class="fas fa-eye" id="toggle-password" onclick="togglePasswordVisibility()" style="position: absolute; right: 15px; cursor: pointer; color: #94a3b8; font-size: 1.1rem; transition: color 0.2s;" title="Toggle Password"></i>
            </div>
        </div>

        <button class="btn-login" onclick="handleLogin()">Authorize Access</button>
        
        <p id="error-msg" style="color: #ef4444; margin-top: 1rem; display: none;">Invalid master credentials.</p>

        <div class="footer">
            &copy; 2026 Stafflytics Analytics Intelligence
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passInput = document.getElementById('password');
            const icon = document.getElementById('toggle-password');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.style.color = 'var(--accent)';
            } else {
                passInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.style.color = '#94a3b8';
            }
        }
        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const error = document.getElementById('error-msg');

            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });

            if (response.ok) {
                window.location.reload();
            } else {
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
