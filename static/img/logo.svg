<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 420 420">
    <defs>
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e1b4b" />
        </linearGradient>
        <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#06b6d4" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Circular Background -->
    <rect width="500" height="500" rx="250" fill="url(#bg-grad)" />
    
    <!-- AI Brain / Network Nodes -->
    <g transform="translate(150, 150)" filter="url(#glow)">
        <path d="M100 40 L160 80 L160 150 L100 190 L40 150 L40 80 Z" fill="none" stroke="url(#icon-grad)" stroke-width="12" />
        <circle cx="100" cy="40" r="16" fill="#60a5fa" />
        <circle cx="160" cy="80" r="12" fill="#a78bfa" />
        <circle cx="160" cy="150" r="14" fill="#22d3ee" />
        <circle cx="100" cy="190" r="16" fill="#60a5fa" />
        <circle cx="40" cy="150" r="12" fill="#a78bfa" />
        <circle cx="40" cy="80" r="14" fill="#22d3ee" />
        <circle cx="100" cy="115" r="18" fill="url(#icon-grad)" />
        <line x1="100" y1="40" x2="100" y2="115" stroke="url(#icon-grad)" stroke-width="8" />
        <line x1="160" y1="80" x2="100" y2="115" stroke="url(#icon-grad)" stroke-width="8" />
        <line x1="160" y1="150" x2="100" y2="115" stroke="url(#icon-grad)" stroke-width="8" />
        <line x1="100" y1="190" x2="100" y2="115" stroke="url(#icon-grad)" stroke-width="8" />
        <line x1="40" y1="150" x2="100" y2="115" stroke="url(#icon-grad)" stroke-width="8" />
        <line x1="40" y1="80" x2="100" y2="115" stroke="url(#icon-grad)" stroke-width="8" />
    </g>
</svg>
