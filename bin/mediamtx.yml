# MediaMTX configuration for Stafflytics
rtspAddress: :8554
rtpAddress: :8556
rtcpAddress: :8557

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigin: '*'
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcHandshakeTimeout: 30s

# Increase read timeout to prevent disconnects during brief background AI processing spikes
readTimeout: 30s

# Disable unused protocols to prevent port conflicts with Node/Express/Next.js
rtmp: no
hls: no
srt: no

paths:
  cam:
    source: rtsp://admin:L2DD2594@192.168.50.251:554/cam/realmonitor?channel=1&subtype=0
    # Force RTSP connection over TCP to prevent packet loss, frame dropping, and lag
    rtspTransport: tcp

  mystream:
    runOnDemand: '"C:\Users\Sultan Mahmood\Desktop\stafflytics\stafflytics-ai\bin\ffmpeg.exe" -rtsp_transport tcp -i rtsp://localhost:8554/cam -vf "scale=1280:720" -c:v libx264 -preset ultrafast -tune zerolatency -r 15 -pix_fmt yuv420p -an -rtsp_transport tcp -f rtsp rtsp://localhost:8554/mystream'
    runOnDemandRestart: yes
