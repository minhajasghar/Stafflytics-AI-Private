# MediaMTX configuration for Stafflytics - IMOU HLS MODE (auto-generated)
# Local RTSP relay for the AI pipeline. Browser plays Imou HLS directly.
rtspAddress: :8554
rtpAddress: :8556
rtcpAddress: :8557

webrtc: no

readTimeout: 30s

rtmp: no
hls: no
srt: no

paths:
  cam:
    # Imou HLS -> RTSP relay. ffmpeg (imou bridge) publishes the Imou HEVC stream
    # here; this path accepts external publishers only.
    source: publisher

  cam_ai:
    # H.264 transcoded stream for OpenCV / YOLO AI processing (unchanged).
    runOnInit: '"D:\Desktop\Stafflytics\stafflytics-ai\bin\ffmpeg.exe" -loglevel quiet -rtsp_transport tcp -i rtsp://localhost:8554/cam -vf "scale=640:480" -c:v libx264 -preset ultrafast -tune zerolatency -r 15 -pix_fmt yuv420p -an -rtsp_transport tcp -f rtsp rtsp://localhost:8554/cam_ai'
    runOnInitRestart: yes
